services:
  postgres:
    image: postgres:15-alpine
    container_name: web4-postgres
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - web4-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-1.0-SNAPSHOT}
    image: web4-app:${APP_VERSION:-1.0-SNAPSHOT}
    container_name: web4-app
    ports:
      - "8080:8080"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: postgres
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      APP_VERSION: ${APP_VERSION:-1.0-SNAPSHOT}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - web4-network

  test:
    build:
      context: .
      target: build
      args:
        APP_VERSION: ${APP_VERSION:-1.0-SNAPSHOT}
    image: web4-build:${APP_VERSION:-1.0-SNAPSHOT}
    container_name: web4-test
    environment:
      BASE_URL: http://app:8080
      APP_VERSION: ${APP_VERSION:-1.0-SNAPSHOT}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: postgres
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "0"
    depends_on:
      postgres:
        condition: service_healthy
      app:
        condition: service_started
    networks:
      - web4-network
    command: ["./gradlew", "test", "functionalTest", "--no-daemon", "-Dapp.base.url=http://app:8080"]
    profiles:
      - test

volumes:
  postgres_data:

networks:
  web4-network:
    driver: bridge
