services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build:
      context: .
      target: runtime
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      POSTGRES_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy

  test:
    build:
      context: .
      target: test
    environment:
      BASE_URL: http://app:8080
    depends_on:
      app:
        condition: service_started
    volumes:
      - ./build/docker-test-results:/workspace/build/test-results
      - ./build/docker-test-reports:/workspace/build/reports/tests
    profiles: [test]

volumes:
  postgres_data:
