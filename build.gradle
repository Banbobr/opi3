plugins {
    id 'java'
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}

def parameters = new Properties()
file('build.properties').withInputStream { parameters.load(it) }
def parameter = { String name -> providers.gradleProperty(name).getOrElse(parameters.getProperty(name)) }
group = parameter('group')
version = parameter('version')
java.sourceCompatibility = JavaVersion.toVersion(parameter('javaVersion'))
springBoot.mainClass = parameter('mainClass')

repositories { mavenCentral() }

sourceSets {
    functionalTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += output + compileClasspath
    }
}
configurations {
    compileOnly.extendsFrom annotationProcessor
    functionalTestImplementation.extendsFrom testImplementation
    functionalTestRuntimeOnly.extendsFrom testRuntimeOnly
}
dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-jooq'
    runtimeOnly "org.postgresql:postgresql:${parameter('postgresVersion')}"
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    functionalTestImplementation "com.microsoft.playwright:playwright:${parameter('playwrightVersion')}"
    functionalTestRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

def localizationSource = file(parameter('localizationSource'))
def localizationOutput = layout.buildDirectory.file(parameter('localizationOutput'))
def frontendOutput = layout.buildDirectory.dir(parameter('frontendOutput'))

tasks.register('native2ascii') {
    group = 'build'
    description = 'преобразование native2ascii для копий файлов локализации'
    inputs.file localizationSource
    outputs.file localizationOutput
    doLast {
        def result = new StringBuilder()
        localizationSource.getText('UTF-8').toCharArray().each { char c ->
            result.append(c > 127 ? String.format('\\u%04x', (int) c) : String.valueOf(c))
        }
        def output = localizationOutput.get().asFile
        output.parentFile.mkdirs()
        output.setText(result.toString(), 'US-ASCII')
    }
}

tasks.register('npmCi', Exec) {
    group = 'build'
    inputs.files 'package.json', 'package-lock.json'
    outputs.dir 'node_modules'
    commandLine parameter('npmExecutable'), 'ci', '--no-audit', '--no-fund'
}
tasks.register('buildFrontend', Exec) {
    group = 'build'
    dependsOn 'npmCi'
    inputs.files fileTree('src') { include '**/*.vue', '**/*.js', '**/*.css' }
    inputs.files 'index.html', 'vite.config.js', 'package.json', 'package-lock.json'
    outputs.dir frontendOutput
    commandLine parameter('npmExecutable'), 'run', 'build', '--', '--outDir', frontendOutput.get().asFile.absolutePath
}
processResources {
    dependsOn 'native2ascii', 'buildFrontend'
    exclude 'messages_unicode.properties'
    from(localizationOutput)
    from(frontendOutput) { into 'static' }
}
tasks.register('compile') {
    group = 'build'
    dependsOn 'compileJava'
}
jar { enabled = false }
bootJar {
    dependsOn 'compile'
    archiveFileName = parameter('archiveName')
    manifest { attributes 'Version': project.version }
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    testLogging { events 'passed', 'failed', 'skipped' }
}
test { dependsOn 'bootJar' }

tasks.register('installPlaywrightBrowsers', JavaExec) {
    group = 'verification'
    description = 'скачивает Chromium'
    classpath = configurations.functionalTestRuntimeClasspath
    mainClass = 'com.microsoft.playwright.CLI'
    args 'install'
    if (providers.gradleProperty('playwrightWithDeps').getOrElse('false').toBoolean()) {
        args '--with-deps'
    }
    args parameter('browser')
}
tasks.register('functionalTest', Test) {
    group = 'verification'
    description = 'запуск 15 функциональных тестов'
    environment 'PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD', '1'
    dependsOn 'bootJar', 'functionalTestClasses'
    mustRunAfter 'test'
    testClassesDirs = sourceSets.functionalTest.output.classesDirs
    classpath = sourceSets.functionalTest.runtimeClasspath
    systemProperty 'app.jar', tasks.named('bootJar').get().archiveFile.get().asFile.absolutePath
    systemProperty 'app.port', parameter('functionalPort')
    systemProperty 'app.timeout.seconds', parameter('functionalTimeoutSeconds')
    systemProperty 'app.log', layout.buildDirectory.file('functional-app.log').get().asFile.absolutePath
    systemProperty 'app.base.url', System.getProperty('app.base.url', System.getenv('BASE_URL') ?: '')
    systemProperty 'playwright.channel', System.getProperty('playwright.channel', System.getenv('PLAYWRIGHT_CHANNEL') ?: '')
    outputs.upToDateWhen { false }
}
check { dependsOn 'functionalTest' }

// Limit the commit to configured paths, preserving unrelated staged changes.
tasks.register('diff') {
    group = 'versioning'
    doLast {
        def git = { List<String> arguments ->
            def output = new ByteArrayOutputStream()
            exec {
                commandLine(['git'] + arguments)
                standardOutput = output
            }
            output.toString('UTF-8').trim()
        }
        def paths = parameter('trackedClasses').split(',').collect { it.trim() }.findAll { it }
        def changed = paths.findAll { git(['status', '--porcelain', '--', it]) }
        if (changed.empty) {
            logger.lifecycle('нет изменений')
            return
        }
        git(['add', '--'] + changed)
        git(['commit', '--only', '-m', parameter('commitMessage'), '--'] + changed)
        logger.lifecycle("Committed: ${changed.join(', ')}")
    }
}
